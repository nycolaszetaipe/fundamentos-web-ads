<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - IngressosFácil</title>
</head>
<body>
    <header>
        <h1>IngressosFácil</h1>
    </header>

    <main>
        <section id="home">
            <h2>Cadastro</h2>
        </section>
        <section>
            <form id="registerForm" method="POST">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required minlength="3" />
                <br>

                <label for="email">Endereço de e-mail:</label>
                <input type="email" id="email" name="email" required />
                <br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="8" maxlength="12" />
                <br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    required
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                    placeholder="000.000.000-00"
                    title="Formato esperado: 000.000.000-00"
                />
                <br>

                <label for="mensagem">Mensagem (opcional):</label>
                <br>
                <textarea id="mensagem" name="mensagem" rows="4" cols="30" placeholder="Digite o texto"></textarea>
                <br>

                <label for="evento">Escolha o seu evento:</label>
                <select id="evento" name="evento">
                    <option value="Rock">Show Rock</option>
                    <option value="Sertanejo">Show Sertanejo</option>
                    <option value="Jogos">Jogos Universitários</option>
                </select>
                <br>

                <label for="termos">
                    <input id="termos" name="termos" type="checkbox" required />
                    Concordo com os termos de uso
                </label>
                <br>

                <label><input type="radio" value="pix" name="pagamento" required />Pix</label>
                <label><input type="radio" value="cartao" name="pagamento" required />Cartão</label>
                <br>

                <label for="quantidade">Quantidade de ingressos:</label>
                <input type="number" id="quantidade" name="quantidade" step="5" min="0" />
                <br>

                <input type="submit" value="Cadastrar" />
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 IngressosFácil</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Evita o recarregamento da página

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;
            const mensagem = document.getElementById('mensagem').value;
            const evento = document.getElementById('evento').value;
            const pagamento = document.querySelector('input[name="pagamento"]:checked');
            const quantidade = document.getElementById('quantidade').value;

            alert(
                `Cadastro recebido!\n` +
                `Nome: ${nome}\n` +
                `E-mail: ${email}\n` +
                `CPF: ${cpf}\n` +
                `Evento: ${evento}\n` +
                `Mensagem: ${mensagem || '(nenhuma)'}\n` +
                `Pagamento: ${pagamento ? pagamento.value : '(não selecionado)'}\n` +
                `Quantidade: ${quantidade || '(não informada)'}`
            );
        });
    </script>
</body>
</html>
